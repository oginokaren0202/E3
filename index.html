<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>載入中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
</style>
<script src="render.js"></script>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main id="app"><p class="msg">載入中……</p></main>
<script>
const app = document.getElementById('app');
async function getText(path){
  const r = await fetch(encodeURI(path), {cache:'no-cache'});
  return r.ok ? r.text() : null;
}
let setting, items, problems = [];
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const d = items.find(x => x.id === id);
  if (d) {
    document.title = `${d.title}｜${setting.title}`;
    const i = items.indexOf(d), prev = items[i-1], next = items[i+1];
    app.innerHTML = renderDay(d.label, d) + `
      <nav class="pager" aria-label="換頁">
        ${prev?`<a href="#${encodeURIComponent(prev.id)}"><small>上一篇</small>${esc(prev.title)}</a>`:'<span></span>'}
        <a class="home" href="#">目錄</a>
        ${next?`<a class="next" href="#${encodeURIComponent(next.id)}"><small>下一篇</small>${esc(next.title)}</a>`:'<span></span>'}
      </nav>`;
  } else {
    document.title = setting.title || '目錄';
    const warn = problems.length ? `<p class="msg" style="padding:1rem 0;color:#9A3B3B">${problems.map(esc).join('<br>')}</p>` : '';
    app.innerHTML = renderCover(setting) + warn + (items.length
      ? `<ol class="days">${items.map(d => `<li${d.label.includes('幕間')?' class="inter"':''}><a href="#${encodeURIComponent(d.id)}"><span class="n">${esc(d.label)}</span><span class="t">${esc(d.title||'（未命名）')}</span>${d.dice?'<span title="有擲骰判定">🎲</span>':''}</a></li>`).join('')}</ol>`
      : '<p class="msg">目錄是空的。</p>');
  }
  setSnow(d ? levelOf(d) : 1);
  window.scrollTo(0, 0);
}

// ===== 下雪 =====
// 從顯示名稱取天數：支援「第3天」「第三日」「Day 12」等
function dayNumber(label){
  const a = label.match(/\d+/);
  if (a) return +a[0];
  const c = label.match(/[〇零一二兩三四五六七八九十]+/);
  if (!c) return null;
  const D = {'〇':0,'零':0,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const t = c[0];
  if (!t.includes('十')) return D[t] ?? null;
  const [tens, ones] = t.split('十');
  return (tens ? D[tens] : 1) * 10 + (ones ? D[ones] : 0);
}
// 1–7 稀疏、8–14 稍密、15–21 密集、22 以後 多
// 沒有天數的篇（前日談、幕間）沿用前一個有天數的篇；再往前都沒有就用稀疏
function levelOf(d){
  for (let i = items.indexOf(d); i >= 0; i--){
    const n = dayNumber(items[i].label);
    if (n) return n <= 7 ? 1 : n <= 14 ? 2 : n <= 21 ? 3 : 4;
  }
  return 1;
}

const LEVELS = {1:{count:22, speed:0.5}, 2:{count:55, speed:0.65}, 3:{count:105, speed:0.8}, 4:{count:170, speed:1}};
const cv = document.getElementById('snow'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let flakes = [], target = 0, speedK = 0.5, W = 0, H = 0, running = false;

function resize(){
  const r = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * r; cv.height = H * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
function newFlake(top){
  return {x: Math.random() * W, y: top ? -10 : Math.random() * H,
          r: 0.8 + Math.random() * 2.2, v: 0.4 + Math.random() * 0.8,
          sway: Math.random() * Math.PI * 2, a: 0.5 + Math.random() * 0.5};
}
function setSnow(level){
  const L = LEVELS[level];
  target = Math.round(L.count * (innerWidth * innerHeight) / (1280 * 800));
  speedK = L.speed;
  if (!running && !reduce.matches) { running = true; requestAnimationFrame(tick); }
}
// 文字欄位範圍內的雪花淡到幾乎透明，邊緣漸變
let col = {left:0, right:0};
function fadeAt(x){
  const m = col, edge = 48;
  const d = Math.min(x - m.left, m.right - x);
  if (d <= -edge) return 1;
  if (d >= 0) return 0.06;
  return 0.06 + (-d / edge) * 0.94;
}
function tick(){
  if (reduce.matches) { ctx.clearRect(0, 0, W, H); running = false; return; }
  // 雪量逐步增減，不會突然變化
  if (flakes.length < target) flakes.push(newFlake(true));
  col = app.getBoundingClientRect();   // 每幀量一次文字欄位位置
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (let i = flakes.length - 1; i >= 0; i--){
    const f = flakes[i];
    f.y += f.v * speedK * (0.6 + f.r / 3);
    f.sway += 0.01;
    f.x += Math.sin(f.sway) * 0.3;
    if (f.y > H + 10){
      if (flakes.length > target) { flakes.splice(i, 1); continue; }
      Object.assign(f, newFlake(true));
    }
    ctx.globalAlpha = f.a * fadeAt(f.x);
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(tick);
}
addEventListener('resize', () => { resize(); setSnow(currentLevel()); });
function currentLevel(){ const d = items && items.find(x => x.id === decodeURIComponent(location.hash.slice(1))); return d ? levelOf(d) : 1; }
resize();

(async () => {
  setting = parseSetting(await getText('setting.txt'));
  const tocText = await getText('toc.txt');
  const toc = parseToc(tocText);
  const texts = await Promise.all(toc.map(t => getText('days/' + t.file)));
  items = toc.map((t, i) => texts[i] === null ? null : {...t, ...parseDay(texts[i], setting.chars)}).filter(Boolean);
  // 讀不到的檔案，在目錄頁上方列出，方便檢查
  if (tocText === null) problems.push('找不到 toc.txt');
  else if (!toc.length) problems.push('toc.txt 裡沒有可讀的行（格式：顯示名稱 檔名.txt）');
  toc.forEach((t, i) => { if (texts[i] === null) problems.push(`找不到 days/${t.file}`); });
  route();
  addEventListener('hashchange', route);
})().catch(() => { app.innerHTML = '<p class="msg">讀取失敗。請確認 setting.txt、toc.txt 和 days 資料夾都已上傳。</p>'; });
</script>
</body>
</html>
