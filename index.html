<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>載入中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="render.js"></script>
</head>
<body>
<main id="app"><p class="msg">載入中……</p></main>
<script>
const app = document.getElementById('app');
async function getText(path){
  const r = await fetch(encodeURI(path), {cache:'no-cache'});
  return r.ok ? r.text() : null;
}
let setting, items, problems = [];
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const d = items.find(x => x.id === id);
  if (d) {
    document.title = `${d.title}｜${setting.title}`;
    const i = items.indexOf(d), prev = items[i-1], next = items[i+1];
    app.innerHTML = renderDay(d.label, d) + `
      <nav class="pager" aria-label="換頁">
        ${prev?`<a href="#${encodeURIComponent(prev.id)}"><small>上一篇</small>${esc(prev.title)}</a>`:'<span></span>'}
        <a class="home" href="#">目錄</a>
        ${next?`<a class="next" href="#${encodeURIComponent(next.id)}"><small>下一篇</small>${esc(next.title)}</a>`:'<span></span>'}
      </nav>`;
  } else {
    document.title = setting.title || '目錄';
    const warn = problems.length ? `<p class="msg" style="padding:1rem 0;color:#9A3B3B">${problems.map(esc).join('<br>')}</p>` : '';
    app.innerHTML = renderCover(setting) + warn + (items.length
      ? `<ol class="days">${items.map(d => `<li${d.label.includes('幕間')?' class="inter"':''}><a href="#${encodeURIComponent(d.id)}"><span class="n">${esc(d.label)}</span><span class="t">${esc(d.title||'（未命名）')}</span>${d.dice?'<span title="有擲骰判定">🎲</span>':''}</a></li>`).join('')}</ol>`
      : '<p class="msg">目錄是空的。</p>');
  }
  window.scrollTo(0, 0);
}
(async () => {
  setting = parseSetting(await getText('setting.txt'));
  const tocText = await getText('toc.txt');
  const toc = parseToc(tocText);
  const texts = await Promise.all(toc.map(t => getText('days/' + t.file)));
  items = toc.map((t, i) => texts[i] === null ? null : {...t, ...parseDay(texts[i], setting.chars)}).filter(Boolean);
  // 讀不到的檔案，在目錄頁上方列出，方便檢查
  if (tocText === null) problems.push('找不到 toc.txt');
  else if (!toc.length) problems.push('toc.txt 裡沒有可讀的行（格式：顯示名稱 檔名.txt）');
  toc.forEach((t, i) => { if (texts[i] === null) problems.push(`找不到 days/${t.file}`); });
  route();
  addEventListener('hashchange', route);
})().catch(() => { app.innerHTML = '<p class="msg">讀取失敗。請確認 setting.txt、toc.txt 和 days 資料夾都已上傳。</p>'; });
</script>
</body>
</html>
